<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="445" viewBox="0 0 1200 445" role="img" aria-labelledby="title desc">
  <title id="title">MatX JIT fusion performs the same pipeline with less work</title>
  <desc id="desc">A staged normalization, FFT, and post-processing pipeline uses three launches and two temporary tensors. MatX JIT combines it into one generated kernel with no temporary tensors.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1015"/>
      <stop offset="1" stop-color="#111a20"/>
    </linearGradient>
    <linearGradient id="fused" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#294b0c"/>
      <stop offset=".5" stop-color="#568c12"/>
      <stop offset="1" stop-color="#294b0c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="445" rx="22" fill="url(#bg)"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="55" y="55" fill="#8f9da6" font-size="16" font-weight="750" letter-spacing="2.5">STAGED EXECUTION</text>
    <text x="1145" y="55" text-anchor="end" fill="#aab5bc" font-size="20" font-weight="700">3 launches  ·  2 temporaries  ·  extra memory traffic</text>

    <g transform="translate(55 82)">
      <rect width="220" height="86" rx="14" fill="#1b2630" stroke="#53626d" stroke-width="2"/>
      <text x="110" y="39" text-anchor="middle" fill="#f1f5f7" font-size="22" font-weight="750">Normalize</text>
      <text x="110" y="65" text-anchor="middle" fill="#93a1aa" font-size="15">CUDA kernel</text>

      <path d="M230 39h24v-8l16 12-16 12v-8h-24z" fill="#82929d"/>

      <rect x="280" y="17" width="100" height="52" rx="12" fill="#2a2028" stroke="#8f6572" stroke-width="2"/>
      <text x="330" y="49" text-anchor="middle" fill="#f0b0c0" font-size="16" font-weight="750">TEMP</text>

      <path d="M390 39h24v-8l16 12-16 12v-8h-24z" fill="#82929d"/>

      <rect x="440" width="180" height="86" rx="14" fill="#1b2630" stroke="#53626d" stroke-width="2"/>
      <text x="530" y="39" text-anchor="middle" fill="#f1f5f7" font-size="22" font-weight="750">FFT</text>
      <text x="530" y="65" text-anchor="middle" fill="#93a1aa" font-size="15">cuFFT</text>

      <path d="M630 39h24v-8l16 12-16 12v-8h-24z" fill="#82929d"/>

      <rect x="680" y="17" width="100" height="52" rx="12" fill="#2a2028" stroke="#8f6572" stroke-width="2"/>
      <text x="730" y="49" text-anchor="middle" fill="#f0b0c0" font-size="16" font-weight="750">TEMP</text>

      <path d="M790 39h24v-8l16 12-16 12v-8h-24z" fill="#82929d"/>

      <rect x="840" width="250" height="86" rx="14" fill="#1b2630" stroke="#53626d" stroke-width="2"/>
      <text x="965" y="39" text-anchor="middle" fill="#f1f5f7" font-size="22" font-weight="750">Post-process</text>
      <text x="965" y="65" text-anchor="middle" fill="#93a1aa" font-size="15">CUDA kernel</text>
    </g>

    <path d="M55 211h1090" stroke="#33414b" stroke-width="2"/>

    <text x="55" y="267" fill="#a6ff4d" font-size="16" font-weight="750" letter-spacing="2.5">MATX JIT</text>
    <text x="1145" y="267" text-anchor="end" fill="#d9f4c4" font-size="20" font-weight="700">1 launch  ·  no temporaries  ·  less memory traffic</text>

    <g transform="translate(55 294)">
      <rect width="1090" height="118" rx="16" fill="url(#fused)" stroke="#8bd12b" stroke-width="2"/>
      <circle cx="48" cy="59" r="10" fill="#b7ff66"/>
      <text x="82" y="50" fill="#f8fff4" font-size="25" font-weight="750">Normalize  +  FFT  +  post-process</text>
      <text x="82" y="80" fill="#d9f4c4" font-size="16" font-weight="750" letter-spacing="1.5">ONE GENERATED KERNEL</text>
      <path d="M665 55h30v-10l20 14-20 14v-10h-30z" fill="#a6ff4d"/>
      <rect x="920" y="25" width="140" height="68" rx="13" fill="#17300e" stroke="#a6ff4d" stroke-width="2"/>
      <text x="990" y="67" text-anchor="middle" fill="#f8fff4" font-size="21" font-weight="800">OUTPUT</text>
    </g>
  </g>
</svg>
