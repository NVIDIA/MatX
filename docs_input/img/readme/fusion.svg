<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">MatX JIT fusion performs the same pipeline with less work</title>
  <desc id="desc">A staged normalization, FFT, and post-processing pipeline uses three launches and two temporary tensors. MatX JIT combines it into one generated kernel with no temporary tensors.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1015"/>
      <stop offset="1" stop-color="#111a20"/>
    </linearGradient>
    <linearGradient id="fused" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#294b0c"/>
      <stop offset=".5" stop-color="#568c12"/>
      <stop offset="1" stop-color="#294b0c"/>
    </linearGradient>
    <marker id="arrowGray" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#82929d"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#a6ff4d"/>
    </marker>
  </defs>

  <rect width="1200" height="500" rx="22" fill="url(#bg)"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="55" y="55" fill="#8f9da6" font-size="16" font-weight="750" letter-spacing="2.5">STAGED EXECUTION</text>
    <text x="1145" y="55" text-anchor="end" fill="#aab5bc" font-size="20" font-weight="700">3 launches  ·  2 temporaries  ·  extra memory traffic</text>

    <g transform="translate(55 82)">
      <rect width="250" height="86" rx="14" fill="#1b2630" stroke="#53626d" stroke-width="2"/>
      <text x="125" y="39" text-anchor="middle" fill="#f1f5f7" font-size="23" font-weight="750">Normalize</text>
      <text x="125" y="65" text-anchor="middle" fill="#93a1aa" font-size="15">CUDA kernel</text>

      <path d="M270 43h65" stroke="#82929d" stroke-width="3" marker-end="url(#arrowGray)"/>
      <text x="302" y="76" text-anchor="middle" fill="#c28d99" font-size="14" font-weight="700">TEMP</text>

      <rect x="360" width="250" height="86" rx="14" fill="#1b2630" stroke="#53626d" stroke-width="2"/>
      <text x="485" y="39" text-anchor="middle" fill="#f1f5f7" font-size="23" font-weight="750">FFT</text>
      <text x="485" y="65" text-anchor="middle" fill="#93a1aa" font-size="15">cuFFT</text>

      <path d="M630 43h65" stroke="#82929d" stroke-width="3" marker-end="url(#arrowGray)"/>
      <text x="662" y="76" text-anchor="middle" fill="#c28d99" font-size="14" font-weight="700">TEMP</text>

      <rect x="720" width="370" height="86" rx="14" fill="#1b2630" stroke="#53626d" stroke-width="2"/>
      <text x="905" y="39" text-anchor="middle" fill="#f1f5f7" font-size="23" font-weight="750">Calibrate + magnitude + dB</text>
      <text x="905" y="65" text-anchor="middle" fill="#93a1aa" font-size="15">CUDA kernel</text>
    </g>

    <path d="M55 211h1090" stroke="#33414b" stroke-width="2"/>

    <text x="55" y="267" fill="#a6ff4d" font-size="16" font-weight="750" letter-spacing="2.5">MATX JIT</text>
    <text x="1145" y="267" text-anchor="end" fill="#d9f4c4" font-size="20" font-weight="700">1 launch  ·  no temporaries  ·  less memory traffic</text>

    <g transform="translate(55 294)">
      <rect width="1090" height="118" rx="16" fill="url(#fused)" stroke="#8bd12b" stroke-width="2"/>
      <circle cx="48" cy="59" r="10" fill="#b7ff66"/>
      <text x="82" y="50" fill="#f8fff4" font-size="25" font-weight="750">Normalize  +  FFT  +  calibrate  +  magnitude  +  dB</text>
      <text x="82" y="80" fill="#d9f4c4" font-size="16" font-weight="750" letter-spacing="1.5">ONE GENERATED KERNEL</text>
      <path d="M900 59h95" stroke="#a6ff4d" stroke-width="4" marker-end="url(#arrowGreen)"/>
      <text x="1035" y="68" text-anchor="middle" fill="#f8fff4" font-size="27" font-weight="800">output</text>
    </g>

    <text x="600" y="463" text-anchor="middle" fill="#e8eef2" font-size="25" font-weight="750">Same expression. Less work. More speed.</text>
  </g>
</svg>
